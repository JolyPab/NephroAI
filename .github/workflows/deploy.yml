name: Deploy to Server

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest backend/tests -v

      - name: Python dependency audit
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off --timeout 15

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/medic-frontend
          if-no-files-found: error

  docker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        env:
          POSTGRES_USER: medic_ci
          POSTGRES_PASSWORD: medic_ci_password
          POSTGRES_DB: medic_ci
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t nephroai-api-ci .

      - name: Container vulnerability scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nephroai-api-ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Container critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nephroai-api-ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-build
      - docker-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/medic-frontend

      - name: Copy app files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,nginx.conf,livekit.yaml,backend/**,frontend/dist/medic-frontend/**,landing/**,ops/**"
          target: "~/medic"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/medic
            cd ~/medic
            set -a
            [ -f .env ] && . ./.env
            set +a
            python - <<'PY'
            import os
            required = [
                "POSTGRES_USER",
                "POSTGRES_PASSWORD",
                "POSTGRES_DB",
                "JWT_SECRET",
                "ENV",
                "CORS_ORIGINS",
            ]
            missing = [name for name in required if not os.getenv(name)]
            if missing:
                raise SystemExit("Missing required production env vars: " + ", ".join(missing))
            if os.getenv("POSTGRES_PASSWORD") in {"medic", "password", "changeme", "change-me-use-a-long-random-password"}:
                raise SystemExit("POSTGRES_PASSWORD must be non-default")
            PY
            cat > livekit.yaml <<EOF
            port: 7880
            rtc:
              node_ip: ${LIVEKIT_NODE_IP:-209.50.54.90}
              use_external_ip: false
              tcp_port: 7881
              udp_port: 7882
            redis:
              address: redis:6379
            keys:
              ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-nephroai-dev-livekit-secret-2026-local}
            logging:
              level: info
            EOF
            docker compose up -d --build
            docker compose restart nginx
            docker compose ps
            docker compose exec -T api python -c 'import os; raise SystemExit(0 if (os.getenv("JWT_SECRET") or os.getenv("SECRET_KEY")) else "JWT_SECRET/SECRET_KEY is not visible inside api container")'
            curl -fsS http://localhost/api/health
            curl -fsS http://localhost/api/health/ready
            docker compose logs --tail=80 api worker

      - name: Public health check
        run: |
          check_url() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              if curl -fsS "$url"; then
                return 0
              fi
              echo "Waiting for $url (attempt $attempt/5)"
              sleep 5
            done
            curl -fsS "$url"
          }

          check_header() {
            local header="$1"
            for attempt in 1 2 3 4 5; do
              if curl -fsSI https://app.nephroai.ec | grep -i "^${header}:"; then
                return 0
              fi
              echo "Waiting for header $header (attempt $attempt/5)"
              sleep 5
            done
            curl -fsSI https://app.nephroai.ec | grep -i "^${header}:"
          }

          check_url https://app.nephroai.ec/api/health
          check_url https://app.nephroai.ec/api/health/ready
          check_header strict-transport-security
          check_header x-content-type-options
          check_header x-frame-options
